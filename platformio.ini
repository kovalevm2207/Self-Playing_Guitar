[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_port = COM5
build_src_filter =
    -<*>
    +<main.cpp>
    -<max_speed_test.cpp>

lib_deps =
    waspinator/AccelStepper@^1.64

