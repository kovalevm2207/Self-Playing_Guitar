[env:tmc2209_accuracy_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -DACCURACY_TEST
build_src_filter =
    -<*>
    +<tmc2209_fret_test.cpp>

[env:tmc2209_uart_minimal_alt]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -DUART_USE_ALT
build_src_filter =
    -<*>
    +<tmc2209_uart_minimal.cpp>
lib_deps =
    paulstoffregen/AltSoftSerial@^1.4

[env:tmc2209_uart_minimal]
platform = atmelavr
board = uno
